name: Release Build Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.msi / .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Windows Installer
        run: pnpm --filter @apps/demo tauri:build

      - name: Inspect Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path . -Recurse -Filter *.msi | Where-Object { $_.FullName -match 'bundle[\\/]msi' }) + @(Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'bundle[\\/]nsis' })
          if ($artifacts.Count -eq 0) { throw "No Windows installer artifacts were generated." }
          $artifacts | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | Format-Table | Out-File checksums-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            checksums-windows.txt

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure Android Release Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/demo/src-tauri/gen/android/app/release.jks
          echo "ANDROID_KEYSTORE_PATH=release.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm --filter @apps/demo tauri -- android build --apk

      - name: Inspect Android Artifact
        run: |
          apk=$(find apps/demo/src-tauri/gen -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          sha256sum "$apk" > checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            apps/demo/src-tauri/gen/**/*.apk
            checksums-android.txt

  publish:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: release/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release/android

      - name: Generate Cryptographic SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release/windows/**/*.msi
            release/windows/**/*.exe
            release/android/**/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.exe
            release/windows/checksums-windows.txt
            release/android/**/*.apk
            release/android/checksums-android.txt
          generate_release_notes: true
