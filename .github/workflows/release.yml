name: Release Build Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.msi / .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package Windows Installer
        run: pnpm --filter @apps/demo tauri:build

      - name: Inspect Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem "target/release/bundle/msi/*.msi") + @(Get-ChildItem "target/release/bundle/nsis/*.exe")
          if ($artifacts.Count -eq 0) { throw "No Windows installer artifacts were generated." }
          $artifacts | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | Format-Table | Out-File checksums-windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            checksums-windows.txt

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust & Android Target
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm --filter @apps/demo tauri -- android build --apk

      - name: Inspect Android Artifact
        run: |
          apk=$(find apps/demo/src-tauri/gen -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          sha256sum "$apk" > checksums-android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            apps/demo/src-tauri/gen/**/*.apk
            checksums-android.txt

  publish:
    name: Publish Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: release/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/windows/**/*.msi
            release/windows/**/*.exe
            release/windows/checksums-windows.txt
            release/android/**/*.apk
            release/android/checksums-android.txt
          generate_release_notes: true
