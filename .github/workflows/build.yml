name: Native Build Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Verify Windows Tauri Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows Installer
        run: pnpm --filter @apps/demo tauri:build

      - name: Inspect Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path . -Recurse -Filter *.msi | Where-Object { $_.FullName -match 'bundle[\\/]msi' }) + @(Get-ChildItem -Path . -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'bundle[\\/]nsis' })
          if ($artifacts.Count -eq 0) { throw "No Windows installer artifacts were generated." }
          $artifacts | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | Format-Table

  build-android:
    name: Verify Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm --filter @apps/demo tauri -- android build --apk

      - name: Inspect Android Artifact
        run: |
          apk=$(find apps/demo/src-tauri/gen -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          sha256sum "$apk"

