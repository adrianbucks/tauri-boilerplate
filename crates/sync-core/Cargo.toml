[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
native-core = { path = "../native-core" }
crypto-core = { path = "../crypto-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring"] }
bytes = "1.0"
futures-lite = "2.0"

