[workspace]
resolver = "2"
members = [
    "crates/native-core",
    "crates/identity-core",
    "crates/sync-core",
    "crates/crypto-core",
    "crates/background-core",
    "apps/demo/src-tauri",
    "apps/minimal-consumer/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tauri-boilerplate contributors"]
license = "MIT"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
deprecated = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"


