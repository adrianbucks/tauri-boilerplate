[workspace]
resolver = "2"
members = [
    "crates/native-core",
    "crates/identity-core",
    "crates/sync-core",
    "crates/crypto-core",
    "apps/demo/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tauri-boilerplate contributors"]
license = "MIT"

[workspace.lints.rust]
unused = "deny"
deprecated = "warn"

[workspace.lints.clippy]
all = "warn"
